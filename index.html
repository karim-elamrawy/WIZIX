<script>
const $=s=>document.querySelector(s);
const TABS=[['home','🏠','الرئيسية','Home'],['protect','🛡️','الحماية','Protection'],['scan','🔍','الفحص','Scan'],['tools','🧰','الأدوات','Tools'],['profile','👤','حسابي','Profile']];
const g=(k,d)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}};
const p=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
var READY=false;
let lang=g('bg_lang',(navigator.language||'').startsWith('ar')?'ar':'en'),tab='home',sub=null;
let B=g('bg_b',{mode:'learn',n:0,st:{}}),LOG=g('bg_log',[]),LF=null,LZ=null,RISK=0,HIST=g('bg_hist',[]);
const TARGET=15,WIN=5000;
const T={
 ar:{status:'الحالة',logs:'السجل',scan:'الفحص',vault:'الخزنة',chat:'المساعد',pro:'Pro',secure:'آمن',alert:'تنبيه',
 learn:'وضع التعلّم: بيتعلّم نشاطك الطبيعي',mon:'وضع المراقبة',risk:'درجة الخطر',win:'فترات اتحلّلت',metric:'المؤشر',now:'دلوقتي',usual:'المعتاد',dev:'الفرق',
 ev:'عدد الأحداث',speed:'سرعة المؤشر',keyInt:'زمن بين الضغطات',clicks:'النقرات',scrolls:'التمرير',
 relearn:'ابدأ التعلّم من الأول',notifOn:'شغّل إشعارات الحماية',notifDone:'الإشعارات شغّالة',notifNo:'الإشعارات مش مدعومة أو اترفضت',
 nolog:'مفيش أحداث لسه.',clr:'امسح السجل',scanBtn:'ابدأ الفحص العميق',scanNote:'بيفحص بيئة المتصفح والصفحة والصلاحيات. المتصفحات مبتسمحش بقراءة قائمة التطبيقات المثبّتة؛ ده محتاج تطبيق أصلي.',
 vSetup:'اعمل كلمة سر رئيسية (8 حروف على الأقل). مش هتقدر ترجّعها لو نسيتها.',vPw:'كلمة السر الرئيسية',vMk:'اعمل الخزنة',vOpen:'افتح',vLock:'اقفل',vTitle:'العنوان',vText:'المحتوى السري',vAdd:'احفظ مشفّر',vBad:'كلمة السر غلط',vShort:'كلمة السر قصيرة',vDel:'امسح',vNote:'التشفير AES-256-GCM جوه جهازك بس، والخزنة بتتقفل لوحدها لما تسيب الصفحة.',
 chIn:'اسأل عن أمانك...',send:'ابعت',chNote:'مساعد أمني محلي بيشتغل بقواعد وبيانات حالتك الفعلية (مش ذكاء اصطناعي سحابي).',
 plF:'مجاني (الحالي)',plP:'Pro (قريباً)',join:'سجّل اهتمامك',joined:'اهتمامك اتسجّل على الجهاز ده',proNote:'الدفع لسه مش شغّال؛ محتاج سيرفر وبوابة دفع. مفيش أي شراء وهمي هيظهر لك.'},
 en:{status:'Status',logs:'Logs',scan:'Scan',vault:'Vault',chat:'Assistant',pro:'Pro',secure:'SECURE',alert:'ALERT',
 learn:'Learning mode: studying your normal activity',mon:'Monitoring mode',risk:'Risk score',win:'Windows analyzed',metric:'Metric',now:'Now',usual:'Usual',dev:'Deviation',
 ev:'Event count',speed:'Pointer speed',keyInt:'Key interval',clicks:'Clicks',scrolls:'Scrolls',
 relearn:'Relearn',notifOn:'Enable protection notifications',notifDone:'Notifications enabled',notifNo:'Notifications unsupported or denied',
 nolog:'No events yet.',clr:'Clear log',scanBtn:'Start deep scan',scanNote:'Scans the browser, page and permissions. Browsers cannot read the installed apps list; that needs a native app.',
 vSetup:'Create a master password (8+ chars). It cannot be recovered if forgotten.',vPw:'Master password',vMk:'Create vault',vOpen:'Unlock',vLock:'Lock',vTitle:'Title',vText:'Secret content',vAdd:'Save encrypted',vBad:'Wrong password',vShort:'Password too short',vDel:'Delete',vNote:'AES-256-GCM encryption on your device only. Auto-locks when you leave the page.',
 chIn:'Ask about your security...',send:'Send',chNote:'A local security assistant using rules and your real status data (not a cloud AI).',
 plF:'Free (current)',plP:'Pro (coming soon)',join:'Join waitlist',joined:'Interest saved on this device',proNote:'Payments are not enabled yet; they need a server and payment gateway. No fake purchase is shown.'}
};
const t=k=>T[lang][k]||k;
const F=['ev','speed','keyInt','clicks','scrolls'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- logs ----------
function addLog(sev,ar,en){
  LOG.unshift({ts:Date.now(),sev,ar,en});LOG=LOG.slice(0,100);p('bg_log',LOG);
  if(sev==='bd'||sev==='wr')notify(lang==='ar'?ar:en);
  if(READY&&(tab==='home'||sub==='logs'))view();
}
function isAlert(){return LOG.some(l=>l.sev==='bd'&&Date.now()-l.ts<600000)}
function notify(m){try{if(g('bg_notif',false)&&Notification.permission==='granted')new Notification('Wizix',{body:m})}catch(e){}}
async function toggleNotif(){
  try{const r=await Notification.requestPermission();p('bg_notif',r==='granted');addLog(r==='granted'?'ok':'wr',r==='granted'?'الإشعارات اشتغلت':'الإشعارات اترفضت',r==='granted'?'Notifications enabled':'Notifications denied')}
  catch(e){addLog('wr','الإشعارات مش مدعومة هنا','Notifications unsupported here')}
}

// ---------- device fingerprint ----------
const n=navigator;
const INFO={platform:n.platform||'?',lang:n.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,screen:screen.width+'x'+screen.height,touch:n.maxTouchPoints||0,cores:n.hardwareConcurrency||'?',ua:(n.userAgent.match(/(Chrome|Firefox|Safari|Edg)\/[\d.]+/)||['?'])[0]};
const FP=JSON.stringify(INFO);
const oldFp=g('bg_fp',null);
if(oldFp&&oldFp!==FP)addLog('bd','بصمة الجهاز أو المتصفح اتغيّرت من آخر مرة','Device or browser fingerprint changed since last session');
p('bg_fp',FP);

// ---------- real system events ----------
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){lockVault();addLog('in','سبت الصفحة','Page hidden / user left')}else addLog('in','رجعت للصفحة','User returned to page');
});
addEventListener('online',()=>addLog('in','النت رجع','Back online'));
addEventListener('offline',()=>addLog('wr','النت فصل','Went offline'));
['copy','cut','paste'].forEach(e=>document.addEventListener(e,()=>addLog('in','عملية '+({copy:'نسخ',cut:'قص',paste:'لصق'})[e],'Clipboard '+e)));
try{n.connection&&n.connection.addEventListener('change',()=>addLog('in','الشبكة اتغيّرت: '+n.connection.effectiveType,'Network changed: '+n.connection.effectiveType))}catch(e){}
try{n.getBattery&&n.getBattery().then(b=>{b.addEventListener('chargingchange',()=>addLog('in',b.charging?'الشحن بدأ':'الشحن وقف',b.charging?'Charging started':'Charging stopped'));b.addEventListener('levelchange',()=>{if(b.level<=0.15&&!b.charging)addLog('wr','البطارية قربت تخلص','Battery low')})})}catch(e){}
addEventListener('orientationchange',()=>addLog('in','اتجاه الشاشة اتغيّر','Screen orientation changed'));

// ---------- behavior engine ----------
let w,lx=null,ly=null,lk=0;
const rs=()=>{w={ev:0,dist:0,keys:[],clicks:0,scrolls:0}};rs();
addEventListener('pointermove',e=>{if(lx!==null)w.dist+=Math.hypot(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;w.ev++},{passive:true});
addEventListener('pointerup',()=>{lx=null});
addEventListener('pointerdown',()=>{w.clicks++;w.ev++},{passive:true});
addEventListener('keydown',()=>{const x=performance.now();if(lk&&x-lk<2000)w.keys.push(x-lk);lk=x;w.ev++},{passive:true});
addEventListener('scroll',()=>{w.scrolls++;w.ev++},{passive:true,capture:true});
addEventListener('wheel',()=>{w.scrolls++;w.ev++},{passive:true});
function upd(f,x){const s=B.st[f]||(B.st[f]={n:0,m:0,m2:0});s.n++;const d=x-s.m;s.m+=d/s.n;s.m2+=d*(x-s.m)}
function zz(f,x){const s=B.st[f];if(!s||s.n<5)return null;const sd=Math.max(Math.sqrt(s.m2/(s.n-1)),Math.abs(s.m)*.3,1);return Math.abs(x-s.m)/sd}
setInterval(()=>{
  if(w.ev>=3){
    const ft={ev:w.ev,speed:w.dist>0?w.dist/(WIN/1000):null,keyInt:w.keys.length>=3?w.keys.reduce((a,b)=>a+b,0)/w.keys.length:null,clicks:w.clicks,scrolls:w.scrolls};
    LF=ft;
    if(B.mode==='learn'){
      F.forEach(f=>{if(ft[f]!==null)upd(f,ft[f])});B.n++;LZ=null;
      if(B.n>=TARGET){B.mode='monitor';addLog('ok','التعلّم خلص والمراقبة بدأت','Learning complete; monitoring started')}
    }else{
      const z={};let mx=0,tp=null;
      F.forEach(f=>{if(ft[f]!==null){const v=zz(f,ft[f]);z[f]=v;if(v!==null&&v>mx){mx=v;tp=f}}});
      LZ=z;RISK=Math.min(100,Math.round(mx/4*100));
      if(mx>=4)addLog('bd','سلوك غريب جداً: '+T.ar[tp]+' ('+mx.toFixed(1)+'σ)','Highly abnormal behavior: '+T.en[tp]+' ('+mx.toFixed(1)+'σ)');
      else if(mx>=2.5)addLog('wr','سلوك مشبوه: '+T.ar[tp]+' ('+mx.toFixed(1)+'σ)','Suspicious behavior: '+T.en[tp]+' ('+mx.toFixed(1)+'σ)');
      else F.forEach(f=>{if(ft[f]!==null)upd(f,ft[f])});
    }
    HIST.push({ts:Date.now(),ev:ft.ev,r:RISK});HIST=HIST.slice(-120);p('bg_hist',HIST);p('bg_b',B);if(tab==='home'&&!sub)view();
  }
  rs();
},WIN);

// ---------- scan ----------

// ---------- WIZIX Windows local security agent ----------
let SC=null, scanning=false, winReport=null, defenderBusy=false;
async function api(path, options={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(), path==='scan'?90000:30000);
  try{
    const r=await fetch('/api/'+path, {cache:'no-store', ...options, signal:controller.signal});
    const raw=await r.text(); let data={};
    try{data=raw?JSON.parse(raw):{}}catch(_){throw new Error('استجابة غير مفهومة من محرك Windows. أعد تشغيل START_WIZIX.bat.');}
    if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
    return data;
  }catch(e){
    if(e.name==='AbortError')throw new Error('انتهت مهلة العملية. قد تكون صلاحيات Windows أو حجم البيانات سبب التأخير.');
    if(e instanceof TypeError)throw new Error('محرك WIZIX المحلي غير متصل. شغّل START_WIZIX.bat واترك نافذة التشغيل مفتوحة.');
    throw e;
  }finally{clearTimeout(timer)}
}
async function scan(){
  if(scanning)return;
  scanning=true;view();
  try{
    winReport=await api('scan');
    for(const k of ['apps','processes','startup','network','extensions']){
      if(!Array.isArray(winReport[k]))winReport[k]=winReport[k]?[winReport[k]]:[];
    }
    SC={R:[],ts:Date.now()};
    addLog('ok','اكتمل فحص مكونات Windows المتاحة','Windows inventory scan completed');
  }catch(e){
    addLog('wr','تعذر الاتصال بمحرك فحص Windows: '+e.message,'Could not reach Windows scan agent: '+e.message);
  }finally{scanning=false;view()}
}
async function runDefender(kind){
  if(defenderBusy)return;
  if(!confirm(lang==='ar'?(kind==='full'?'هيبدأ Microsoft Defender فحص كامل لكل الملفات والبرامج. قد يستغرق وقتًا طويلًا. نبدأ؟':'هيبدأ Microsoft Defender فحصًا سريعًا. نبدأ؟'):(kind==='full'?'Microsoft Defender will start a full scan of files and programs. This may take a long time. Continue?':'Microsoft Defender will start a quick scan. Continue?')))return;
  defenderBusy=true;view();
  try{
    const d=await api('defender/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:kind})});
    addLog('in',d.message_ar||'تم إرسال طلب الفحص إلى Microsoft Defender',d.message||'Scan request sent to Microsoft Defender');
    alert(lang==='ar'?(d.message_ar||'تم إرسال طلب الفحص'):(d.message||'Scan request sent'));
  }catch(e){alert((lang==='ar'?'تعذر بدء الفحص: ':'Could not start scan: ')+e.message)}
  finally{defenderBusy=false;view()}
}
let URLR=null;
async function checkUrl(){
  const el=document.querySelector('#wizix-url');if(!el||!el.value.trim())return;
  try{URLR=await api('url-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:el.value.trim()})});}
  catch(e){URLR={error:e.message};}
  view();
}
async function refreshWinReport(){
  scanning=true;view();
  try{winReport=await api('scan')}
  catch(e){alert((lang==='ar'?'خطأ الاتصال: ':'Connection error: ')+e.message)}
  finally{scanning=false;view()}
}

let fileListing=null, fileBusy=false, filePath='';
async function browseFiles(path){
  if(fileBusy)return; fileBusy=true; filePath=path||''; view();
  try{fileListing=await api('files?path='+encodeURIComponent(filePath));}
  catch(e){fileListing={error:e.message,path:filePath,entries:[]};}
  finally{fileBusy=false;view();}
}

// ---------- vault ----------
let VK=null,VI=[],vmsg='';
const V=()=>g('bg_vault',null);
const E=new TextEncoder(),D=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){const k=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(x){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),d:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},VK,E.encode(x)))}}
async function opn(o){return D.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},VK,ub(o.d)))}
async function vOpen(setup){
  const pw=$('#vpw').value;vmsg='';
  if(setup){
    if(pw.length<8){vmsg=t('vShort');return view()}
    const salt=crypto.getRandomValues(new Uint8Array(16));VK=await derive(pw,salt);
    p('bg_vault',{salt:b64(salt),check:await seal('ok'),items:[]});VI=[];addLog('ok','الخزنة اتعملت','Vault created');
  }else{
    const v=V();try{VK=await derive(pw,ub(v.salt));await opn(v.check);VI=[];for(const it of v.items)VI.push({id:it.id,...JSON.parse(await opn(it.e))});addLog('in','الخزنة اتفتحت','Vault unlocked')}
    catch(e){VK=null;vmsg=t('vBad');addLog('wr','محاولة فاشلة لفتح الخزنة','Failed vault unlock attempt')}
  }
  view();
}
function lockVault(){if(VK){VK=null;VI=[];if(sub==='vault')view()}}
async function vAdd(){
  const ti=$('#vt').value.trim(),x=$('#vx').value;if(!ti&&!x)return;
  const v=V(),id=Date.now();v.items.push({id,e:await seal(JSON.stringify({t:ti,x}))});p('bg_vault',v);VI.push({id,t:ti,x});view();
}
function vDel(id){const v=V();v.items=v.items.filter(i=>i.id!==id);p('bg_vault',v);VI=VI.filter(i=>i.id!==id);view()}

  if(/لماذا|ليه|why|alert|تنبيه/.test(q))return bd?r('أسباب التنبيهات الأخيرة:\n'+bd,'Reasons for recent alerts:\n'+bd):r('مفيش تنبيهات خطيرة دلوقتي.','No high-risk alerts right now.');

}

  const r=rep(RP);
  return back()+ttl('📊','التقارير','Security Reports')+`<div class="r"><button class="${RP===7?'p':''}" onclick="RP=7;view()">${x('أسبوعي','Weekly')}</button><button class="${RP===30?'p':''}" onclick="${PRO?'RP=30;view()':"go('profile')"}">${x('شهري','Monthly')} ${PRO?'':'🔒 Pro'}</button></div>`+
  `<div class="g3" style="margin-top:12px"><div class="c mini"><b class="bd">${r.bd}</b><small>${x('خطيرة','High')}</small></div><div class="c mini"><b class="wr">${r.wr}</b><small>${x('تحذيرات','Warnings')}</small></div><div class="c mini"><b class="in">${r.n}</b><small>${x('أحداث','Events')}</small></div></div>`+
  `<div class="c"><div>${x('فترات سلوك اتحلّلت','Behavior windows')}: <b>${r.w}</b> · ${x('متوسط الخطر','avg risk')}: <b>${r.avg}%</b></div><div>${x('ملاحظات آخر فحص','Last scan findings')}: <b>${r.sc===null?'—':r.sc}</b></div><div>${x('درجة الأمان','Security score')}: <b>${score()}/100</b></div><div class="r"><button onclick="dl('wizix-report.txt',repTxt(rep(RP)))">⬇ ${x('تنزيل','Download')}</button></div></div>`}
function bars(v,lb,col){const mx=Math.max(1,...v),W=300,H=90,bw=W/v.length;return `<svg viewBox="0 0 ${W} ${H+16}" width="100%">`+v.map((a,i)=>`<rect x="${i*bw+5}" y="${H-a/mx*H}" width="${bw-10}" height="${Math.max(3,a/mx*H)}" rx="5" fill="${col}"/><text x="${i*bw+bw/2}" y="${H+12}" font-size="9" text-anchor="middle" fill="#8a96c4">${lb[i]}</text>`).join('')+`</svg>`}
function line(v,col){if(v.length<2)return'';const mx=Math.max(1,...v),W=300,H=80,s=W/(v.length-1);return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${v.map((a,i)=>(i*s).toFixed(1)+','+(H-4-a/mx*(H-8)).toFixed(1)).join(' ')}"/></svg>`}
function anV(){
  const ds=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5)),v=ds.map(d=>LOG.filter(l=>(l.sev==='bd'||l.sev==='wr')&&new Date(l.ts).toDateString()===d.toDateString()).length),lb=ds.map(d=>d.toLocaleDateString(loc(),{weekday:'short'})),hs=HIST.slice(-40);
  return back()+ttl('📈','التحليلات','Analytics')+`<div class="c"><h3>${x('التنبيهات آخر 7 أيام','Alerts, last 7 days')}</h3>${bars(v,lb,'#a855f7')}</div><div class="c"><h3>${x('نشاط الجهاز والخطر','Device activity and risk')}</h3>`+(PRO?(hs.length>1?line(hs.map(a=>a.ev),'#22d3ee')+line(hs.map(a=>a.r),'#fb4b6a'):`<small>${t('nolog')}</small>`):`<small>🔒 ${x('التحليلات المتقدمة في Pro','Advanced analytics are in Pro')}</small>`)+`</div>`}
function bkV(){
  let h=back()+ttl('💾','نسخ احتياطي مشفّر','Secure Backup');
  if(EMG)return h+`<div class="c bd">${x('مقفول وقت وضع الطوارئ.','Disabled during Emergency Mode.')}</div>`;
  return h+`<div class="c"><small>${x('الملف مشفّر بنفس كلمة سر الخزنة. لو استوردت ملف هيبدّل الخزنة الحالية.','The file stays encrypted with your vault password. Importing replaces the current vault.')}</small><div class="r"><button class="p" onclick="V()?dl('wizix-vault-backup.json',JSON.stringify(V()),'application/json'):0">⬇ ${x('صدّر','Export')}</button></div><input type="file" accept=".json" onchange="imp(this)"></div>`}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.salt||!o.check||!Array.isArray(o.items))throw 0;p('bg_vault',o);lockVault();addLog('ok','النسخة الاحتياطية اتستوردت','Backup imported');view()}catch(er){addLog('wr','ملف النسخة الاحتياطية مش صالح','Invalid backup file')}};r.readAsText(f)}
function lgV(){return back()+ttl('📋','سجل النشاط','Activity Logs')+`<div class="c">`+(LOG.length?LOG.map(logRow).join(''):`<small>${t('nolog')}</small>`)+`<div class="r"><button class="d" onclick="LOG=[];p('bg_log',LOG);view()">${t('clr')}</button></div></div>`}

// profile
function resetAll(){if(!rst){rst=1;return view()}try{Object.keys(localStorage).filter(k=>k.startsWith('bg_')).forEach(k=>localStorage.removeItem(k))}catch(er){}location.reload()}
function prof(){
  const j=g('bg_wait',false),row=(a,b,c)=>`<tr><td>${x(a,b)}</td><td>${c[0]}</td><td>${c[1]}</td></tr>`;
  return ttl('👤','حسابي','Profile')+`<div class="c"><h3>${x('اللغة','Language')}</h3><button class="p" onclick="setLang()">${lang==='ar'?'Switch to English':'التحويل للعربية'}</button></div>`+
  `<div class="c pl tb"><h3>⭐ ${x('الخطط','Plans')}</h3><table><tr><th></th><th>Free</th><th>Pro</th></tr>${row('لوحة الأمان','Dashboard',['✔','✔'])}${row('سجل النشاط','Activity logs',['✔','✔'])}${row('كاشف التصيد','Phishing detector',['5/'+x('يوم','day'),'∞'])}${row('المساعد','Assistant',['10/'+x('يوم','day'),'∞'])}${row('تحليلات متقدمة','Advanced analytics',['—','✔'])}${row('تقارير شهرية','Monthly reports',['—','✔'])}</table><div class="r"><button class="p" onclick="p('bg_wait',true);view()">${j?'✔ '+t('joined'):t('join')}</button></div><small>${t('proNote')}</small></div>`+
  `<div class="c"><button class="d" onclick="resetAll()">${rst?x('اضغط تاني للتأكيد','Tap again to confirm'):x('امسح كل البيانات','Erase all data')}</button></div><small>Wizix v1.0 · ${x('البيانات متخزّنة على جهازك بس','Data stays on your device')}</small>`}

function view(){
  nav();let h;
  if(!welcomed)h=welcome();else if(tab==='home')h=home();else if(tab==='protect')h=protect();else if(tab==='scan')h=scanV();else if(tab==='tools')h=tools();else h=prof();
  $('#v').innerHTML=h;
}
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
READY=true;view();
try{if(navigator.serviceWorker&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
