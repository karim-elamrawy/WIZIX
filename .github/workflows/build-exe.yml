name: Build Windows EXE
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name WIZIX --add-data "index.html;." --add-data "sw.js;." --add-data "manifest.json;." --add-data "icon-192.png;." --add-data "icon-512.png;." --add-data "icon.svg;." wizix_scanner.py
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/WIZIX.exe
